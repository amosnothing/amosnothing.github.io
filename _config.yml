# Just the Docs: pinned for reproducible GitHub Pages builds.
remote_theme: just-the-docs/just-the-docs@v0.12.0

title: 随笔
author: Amos Chen
description: Amos 的技术随笔与 AI 知识库，面向长期阅读、学习与检索。
url: "https://amosnothing.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

# Keep the previous theme files for rollback, without overriding the new theme.
layouts_dir: _layouts_docs
includes_dir: _includes_docs

markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
excerpt_length: 50
date_format: "%Y-%m-%d"
kramdown:
  input: GFM
  toc_levels: "2..3"

color_scheme: light
nav_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "返回顶部"
search_enabled: true
search:
  heading_level: 2
  previews: 3
  rel_url: false
  focus_shortcut_key: k

aux_links:
  "随笔":
    - "/"
  "GitHub":
    - "https://github.com/amosnothing/amosnothing.github.io"
favicon_ico: /assets/img/favicon.ico

# Preserve the existing feed's settings.
social-network-links:
  email: "amos.chenj@outlook.com"
  github: amosnothing

defaults:
  - scope:
      path: ""
    values:
      layout: default
      has_toc: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_exclude: true
  - scope:
      path: index.html
    values:
      nav_order: 2
  - scope:
      path: aboutme.md
    values:
      nav_order: 3
  - scope:
      path: tags.html
    values:
      nav_exclude: true
  - scope:
      path: 404.html
    values:
      nav_exclude: true
      search_exclude: true

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - Appraisals
  - gemfiles/
  - LICENSE
  - README.md
  - THEME.md
  - screenshot.png
  - staticman.yml
  - beautiful-jekyll-theme.gemspec
  - docs/
  - tests/

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
