name: Jekyll documentation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --future --strict_front_matter
      - name: Check documentation output
        run: python3 tests/check_docs.py _site
      - name: Check Chinese and English search
        run: node tests/check_search.cjs _site
